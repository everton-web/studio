<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="_modulo.css">
<style>
  body{height:1000px}
  .mod-head{top:56px}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  .sym{color:var(--tx)}
  .sym svg{width:170px;height:170px;display:block}
  .sig{font-weight:600;font-size:3.1rem;letter-spacing:-.05em;line-height:1;color:var(--tx)}
  .sig .dot{color:var(--ac)}
  .url{font-size:.95rem;color:var(--dim)}
  .footer{position:absolute;left:72px;right:72px;bottom:40px;display:flex;justify-content:space-between;gap:24px;font-size:.78rem;color:var(--dim)}
</style></head>
<body>
  <div class="mod-head">
    <span class="mod-num">10</span><span class="mod-bar"></span><span class="mod-label">FECHAMENTO</span>
  </div>
  <div class="center">
    <div class="sym"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 10 Q58.6 45 84.6 70 Q50 60 15.4 70 Q41.4 45 50 10Z" fill="currentColor"/></svg></div>
    <div class="sig">everton<span class="dot">.</span></div>
    <div class="url">evertonbrito.com</div>
  </div>
  <div class="footer">
    <span>Web design, direção de arte e desenvolvimento: Everton Brito</span>
    <span>2026</span>
  </div>
</body></html>
